name: polaris

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: POLARIS
      POSTGRES_USER: ${POSTGRES_USER:-M73581}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d POLARIS"]
      interval: 5s
      timeout: 3s
      retries: 20
    # intentionally not published to the host

  polaris-db-role:
    # One-off, runs before every bootstrap: creates or updates the
    # non-superuser role Polaris connects as (postgres/app-role.sh). Idempotent.
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    profiles: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: POLARIS
      PGUSER: ${POSTGRES_USER:-M73581}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POLARIS_DB_USER: ${POLARIS_DB_USER:-polaris_app}
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD:?Set POLARIS_DB_PASSWORD in the deployment environment}
    volumes:
      - ./postgres/app-role.sh:/app-role.sh:ro
    entrypoint: ["bash", "/app-role.sh"]

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.9.0@sha256:9ec2467615132f6a837b13fcbb8be23d770c0ffa5a8bb90faf8ebdf513ab14a0
    profiles: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      polaris-db-role:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_JDBC_ADDITIONAL_JDBC_PROPERTIES_CURRENTSCHEMA: POLARIS_SCHEMA
      QUARKUS_DATASOURCE_JDBC_MIN_SIZE: "2"
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "20"
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_DB_USER:-polaris_app}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:?Set POLARIS_DB_PASSWORD in the deployment environment}
      QUARKUS_OTEL_SDK_DISABLED: "true"
    command: >
      bootstrap --realm=${POLARIS_REALM:-ISBUS}
      --credential=${POLARIS_REALM:-ISBUS},${POLARIS_ROOT_CLIENT_ID:-M73580},${POLARIS_ROOT_CLIENT_SECRET:?Set POLARIS_ROOT_CLIENT_SECRET in the deployment environment}

  polaris:
    image: apache/polaris:1.9.0@sha256:bc548500f5ba8e798b7f8e107ad0b8fbd5b5c6d0c5437f56c5ca101219b796d0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Plain HTTP backend. Bind only to the address the TLS gateway reaches
      # (the VM private IP) or 127.0.0.1 for a co-located gateway. Never 0.0.0.0:
      # Docker-published ports bypass host firewalls such as ufw.
      - "${POLARIS_BIND_ADDRESS:?Set POLARIS_BIND_ADDRESS to the VM private IP or 127.0.0.1}:8181:8181"
      # management/health port exposed on localhost only
      - "127.0.0.1:8182:8182"
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_JDBC_ADDITIONAL_JDBC_PROPERTIES_CURRENTSCHEMA: POLARIS_SCHEMA
      QUARKUS_DATASOURCE_JDBC_MIN_SIZE: "2"
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "20"
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_DB_USER:-polaris_app}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:?Set POLARIS_DB_PASSWORD in the deployment environment}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-ISBUS}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Azure identity used for ADLS credential vending (optional at startup)
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      POLARIS_TOKEN_BROKER_SECRET: ${POLARIS_TOKEN_BROKER_SECRET:?Set POLARIS_TOKEN_BROKER_SECRET in the deployment environment}
    volumes:
      - ./configs/polaris/application.properties:/deployments/config/application.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8182/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
