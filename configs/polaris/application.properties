# Apache Polaris server configuration (mounted into the polaris container).
# Reference: https://polaris.apache.org/releases/latest/configuration/configuration-reference/

# Only allow Azure storage for catalogs in this deployment.
polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["AZURE"]
polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=false

# Catalog federation (Polaris -> remote Iceberg REST catalog, i.e. Tableflow).
polaris.features."ENABLE_CATALOG_FEDERATION"=true
polaris.features."ALLOW_EXTERNAL_CATALOG_CREDENTIAL_VENDING"=true
polaris.features."ALLOW_FEDERATED_CATALOGS_CREDENTIAL_VENDING"=true


# Symmetric-key token broker so OAuth tokens survive container restarts.
polaris.authentication.token-broker.type=symmetric-key
polaris.authentication.token-broker.symmetric-key.secret=${POLARIS_TOKEN_BROKER_SECRET}

# Keep readiness protection enabled. Do not set
# polaris.readiness.ignore-severe-issues in production.
