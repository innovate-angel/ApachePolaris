# Apache Polaris server configuration (mounted into the polaris container).
# Reference: https://polaris.apache.org/releases/1.8.0/configuration/configuration-reference/

# Only allow Azure storage for catalogs in this deployment.
polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["AZURE"]
polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=false

# Catalog federation (Polaris -> remote Iceberg REST catalog, i.e. Tableflow).
# ENABLE_CATALOG_FEDERATION defaults to false; the credential-vending flags
# default to true but are pinned explicitly for clarity.
polaris.features."ENABLE_CATALOG_FEDERATION"=true
polaris.features."ALLOW_EXTERNAL_CATALOG_CREDENTIAL_VENDING"=true
polaris.features."ALLOW_FEDERATED_CATALOGS_CREDENTIAL_VENDING"=true
# SUPPORTED_CATALOG_CONNECTION_TYPES (ICEBERG_REST) and
# SUPPORTED_EXTERNAL_CATALOG_AUTHENTICATION_TYPES (OAUTH, BEARER, GCP, SIGV4)
# are left at their defaults.

# Polaris sits behind an existing nginx TLS reverse proxy; honor forwarded headers.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# Symmetric-key token broker so OAuth tokens survive container restarts
# (default rsa-key-pair broker regenerates keys on each boot, invalidating tokens).
# Secret is injected from .env via POLARIS_TOKEN_BROKER_SECRET.
polaris.authentication.token-broker.type=symmetric-key
polaris.authentication.token-broker.symmetric-key.secret=${POLARIS_TOKEN_BROKER_SECRET}

# polaris.readiness.ignore-severe-issues is intentionally NOT set: the server
# starts cleanly without it, and it should only be used to bypass a diagnosed
# readiness blocker (it disables protection against severe config risks).
